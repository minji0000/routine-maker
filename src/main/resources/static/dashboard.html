<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>대시보드 - ROUTINE MAKER</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ["Pretendard Variable", "Pretendard", "system-ui", "sans-serif"] },
                    colors: {
                        brand: { 50: "#f7f3ff", 100: "#ede5ff", 200: "#d9c9ff", 300: "#c4b0fd", 500: "#8b5cf6", 600: "#7c3aed", 700: "#6d28d9", 900: "#2e1065" }
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
    <style>
        body { font-family: "Pretendard Variable", Pretendard, system-ui, sans-serif; letter-spacing: -0.01em; background: #faf9ff; }
        .card { background: #fff; border: 1px solid #eee9fb; border-radius: 1.25rem; }
        .field { width: 100%; padding: .6rem .85rem; background: #fff; border: 1px solid #e2e8f0; border-radius: .75rem; font-size: .875rem; }
        .field:focus { outline: none; border-color: #8b5cf6; box-shadow: 0 0 0 4px #ede5ff; }
        .btn { padding: .55rem 1rem; border-radius: .75rem; font-size: .875rem; font-weight: 600; transition: background-color .15s; }
        .btn-primary { background: #7c3aed; color: #fff; }
        .btn-primary:hover { background: #6d28d9; }
        .btn-ghost { color: #64748b; }
        .btn-ghost:hover { background: #f1f5f9; }
        .cell { transition: background-color .12s, border-color .12s; }
        .sticky-col { position: sticky; left: 0; z-index: 1; background: #fff; }
        dialog { border: 0; border-radius: 1.5rem; padding: 0; color: #1e293b; width: min(92vw, 28rem); box-shadow: 0 25px 50px -12px rgba(46,16,101,.25); }
        dialog::backdrop { background: rgba(46,16,101,.25); }
        :focus-visible { outline: 3px solid #c4b5fd; outline-offset: 2px; }
    </style>
</head>
<body class="text-slate-800 min-h-screen flex flex-col selection:bg-brand-100 selection:text-brand-700">

<!-- HEADER -->
<header class="w-full max-w-4xl mx-auto py-5 px-5 flex justify-between items-center">
    <a href="dashboard.html" class="flex items-center gap-2 text-lg font-extrabold tracking-tight text-brand-900">
        <span class="w-8 h-8 rounded-xl bg-brand-600 flex items-center justify-center text-white">
            <svg class="w-4.5 h-4.5" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
        </span>
        Routine Maker
    </a>
    <div class="flex items-center gap-4 text-sm">
        <span id="nick" class="font-semibold text-slate-700">루틴러</span>
        <a href="index.html" class="text-slate-400 hover:text-brand-600 transition">첫 화면</a>
        <button type="button" onclick="logout()" class="text-slate-400 hover:text-brand-600 transition">로그아웃</button>
    </div>
</header>

<main class="flex-1 w-full max-w-4xl mx-auto px-5 pb-12">

    <!-- Summary -->
    <section class="pt-4 pb-6">
        <p id="today" class="text-sm text-slate-400"></p>
        <div class="mt-3 grid sm:grid-cols-2 gap-4">
            <div class="card p-5">
                <div class="flex items-baseline justify-between">
                    <p class="text-sm font-medium text-slate-500">오늘 달성률</p>
                    <span id="tdPct" class="text-sm font-semibold text-slate-400">–</span>
                </div>
                <p class="mt-2 text-3xl font-extrabold text-brand-900"><span id="tdDone" class="text-brand-600">0</span><span class="text-slate-300"> / </span><span id="tdTotal">0</span><span class="ml-1.5 text-sm font-semibold text-slate-400">완료</span></p>
                <div class="mt-3 h-1.5 rounded-full bg-brand-100 overflow-hidden"><div id="tdBar" class="h-full rounded-full bg-brand-600" style="width:0%;transition:width .4s"></div></div>
                <p class="mt-2.5 text-xs text-slate-400">오늘 체크한 루틴 수 ÷ 전체 루틴 수예요.</p>
            </div>
            <div class="card p-5">
                <div class="flex items-baseline justify-between">
                    <p class="text-sm font-medium text-slate-500"><span id="weekLabelKor">이번 주</span> 달성률</p>
                    <span id="weekPct" class="text-sm font-semibold text-slate-400">0%</span>
                </div>
                <p class="mt-2 text-3xl font-extrabold text-brand-900"><span id="goalMet" class="text-brand-600">0</span><span class="text-slate-300"> / </span><span id="goalTotal">0</span><span class="ml-1.5 text-sm font-semibold text-slate-400">체크</span></p>
                <div class="mt-3 h-1.5 rounded-full bg-brand-100 overflow-hidden"><div id="bar" class="h-full rounded-full bg-brand-600" style="width:0%;transition:width .4s"></div></div>
                <p class="mt-2.5 text-xs text-slate-400">지금까지 체크할 수 있었던 칸 대비 비율이에요.</p>
            </div>
        </div>
    </section>

    <!-- Weekly grid -->
    <section class="card p-4 sm:p-6">
        <div class="flex items-center justify-between flex-wrap gap-3">
            <div class="flex items-center gap-1">
                <button type="button" onclick="moveWeek(-1)" aria-label="이전 주" class="w-8 h-8 rounded-lg text-slate-400 hover:bg-slate-100 hover:text-brand-700 flex items-center justify-center transition">
                    <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
                </button>
                <h3 id="weekLabel" class="text-base font-bold text-slate-800 px-1 min-w-[8.5rem] text-center"></h3>
                <button type="button" onclick="moveWeek(1)" aria-label="다음 주" class="w-8 h-8 rounded-lg text-slate-400 hover:bg-slate-100 hover:text-brand-700 flex items-center justify-center transition">
                    <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>
                </button>
                <button type="button" onclick="moveWeek(0)" class="ml-1 text-xs font-semibold text-brand-600 hover:underline">이번 주</button>
            </div>
            <div class="flex items-center gap-1.5">
                <button type="button" onclick="openCatDialog()" class="btn btn-ghost">카테고리</button>
                <button type="button" onclick="openRoutineDialog(null)" class="btn btn-primary">+ 루틴</button>
            </div>
        </div>

        <div class="mt-4 overflow-x-auto -mx-4 sm:mx-0 px-4 sm:px-0">
            <table class="w-full" style="border-collapse:collapse; min-width:520px">
                <thead id="gridHead"></thead>
                <tbody id="gridBody"></tbody>
            </table>
        </div>
        <p id="empty" class="hidden py-12 text-center text-sm text-slate-400">아직 루틴이 없어요. "+ 루틴"으로 시작해 보세요.</p>
    </section>
</main>

<!-- 루틴 추가/수정 -->
<dialog id="routineDialog" aria-labelledby="rTitle">
    <form onsubmit="saveRoutine(event)" class="p-6 sm:p-7 space-y-4">
        <h3 id="rTitle" class="text-lg font-extrabold text-brand-900">루틴 추가</h3>
        <div>
            <label for="rName" class="block text-xs font-semibold text-slate-500 mb-1.5">이름</label>
            <input id="rName" class="field" required maxlength="20" placeholder="예: 영어 단어 30개">
        </div>
        <div>
            <label for="rCat" class="block text-xs font-semibold text-slate-500 mb-1.5">카테고리</label>
            <select id="rCat" class="field"></select>
            <input id="rCatName" class="field hidden mt-2" maxlength="10" placeholder="새 카테고리 이름" aria-label="새 카테고리 이름">
        </div>
        <div class="flex items-center pt-2">
            <button type="button" id="rDelete" onclick="deleteRoutine()" class="hidden btn text-rose-500 hover:bg-rose-50">삭제</button>
            <div class="ml-auto flex gap-2">
                <button type="button" onclick="document.getElementById('routineDialog').close()" class="btn btn-ghost">취소</button>
                <button class="btn btn-primary">저장</button>
            </div>
        </div>
    </form>
</dialog>

<!-- 카테고리 관리 -->
<dialog id="catDialog" aria-labelledby="catTitle">
    <div class="p-6 sm:p-7">
        <div class="flex items-center justify-between">
            <h3 id="catTitle" class="text-lg font-extrabold text-brand-900">카테고리</h3>
            <button type="button" onclick="document.getElementById('catDialog').close()" aria-label="닫기" class="w-8 h-8 rounded-lg text-slate-400 hover:bg-slate-100 flex items-center justify-center">
                <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
            </button>
        </div>
        <ul id="catList" class="mt-4 space-y-2.5 overflow-y-auto" style="max-height:50vh"></ul>
        <form onsubmit="addCategory(event)" class="mt-4 flex gap-2">
            <input id="catNewName" class="field" maxlength="10" placeholder="새 카테고리" aria-label="새 카테고리 이름">
            <button class="btn btn-primary shrink-0">추가</button>
        </form>
        <p id="catMsg" role="status" class="mt-2.5 text-xs text-rose-500" style="min-height:1rem"></p>
    </div>
</dialog>

<footer class="w-full py-6 text-center text-xs text-slate-400">
    © 2026 ROUTINE MAKER. All rights reserved.
</footer>

<script>
    // ───── 샘플 데이터 (API 연동 시 이 부분을 fetch 결과로 교체) ─────
    var user = { nickname: '루틴러' };
    var COLORS = { purple: '#8b5cf6', mint: '#34c38f', rose: '#f472a0', amber: '#f5a524', sky: '#4aa8ec', slate: '#94a3b8' };
    var COLOR_KEYS = Object.keys(COLORS);
    var categories = [
        { id: 1, name: '공부', color: 'purple' },
        { id: 2, name: '운동', color: 'mint' },
        { id: 3, name: '식단', color: 'rose' }
    ];
    var nextCatId = 4;
    var routines = [
        { id: 1, name: '운동',         catId: 2, ago: [1, 2, 3, 5, 6, 8, 9, 12] },
        { id: 2, name: '식단 관리',    catId: 3, ago: [1, 2, 3, 4, 5, 6, 7, 8, 10] },
        { id: 3, name: '영어 단어',    catId: 1, ago: [1, 2, 4, 5, 8, 9, 10] },
        { id: 4, name: '전공 책 읽기', catId: 1, ago: [2, 3, 6, 9] }
    ];
    var checks = {};          // { 'routineId|YYYY-MM-DD': true }  → DB의 날짜별 체크 기록 테이블
    var nextId = 5, weekOffset = 0, editingId = null;

    var DAYS = ['월', '화', '수', '목', '금', '토', '일'];
    var CHECK = '<svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';

    function $(id) { return document.getElementById(id); }
    function key(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
    function addDays(d, n) { var x = new Date(d); x.setDate(x.getDate() + n); return x; }
    function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
    var now = new Date(), today = new Date(now.getFullYear(), now.getMonth(), now.getDate()), todayKey = key(today);

    // ───── 카테고리 ─────
    function catOf(id) { for (var i = 0; i < categories.length; i++) if (categories[i].id === id) return categories[i]; return null; }
    function findCatByName(name, exceptId) {
        var n = name.toLowerCase();
        for (var i = 0; i < categories.length; i++) if (categories[i].id !== exceptId && categories[i].name.toLowerCase() === n) return categories[i];
        return null;
    }
    function createCategory(name) {
        var c = { id: nextCatId++, name: name, color: COLOR_KEYS[categories.length % 5] };
        categories.push(c);
        return c;
    }
    function setMsg(t) { $('catMsg').textContent = t || ''; }

    function refreshCatSelect(selected) {
        var sel = $('rCat');
        var o = categories.map(function (c) { return '<option value="' + c.id + '">' + esc(c.name) + '</option>'; }).join('');
        sel.innerHTML = o + '<option value="">미분류</option><option value="__new">+ 새 카테고리…</option>';
        var v = String(selected);
        var ok = Array.prototype.some.call(sel.options, function (x) { return x.value === v; });
        sel.value = ok ? v : (categories.length ? String(categories[0].id) : '');
        $('rCatName').classList.toggle('hidden', sel.value !== '__new');
    }

    function renderCatList() {
        if (!categories.length) { $('catList').innerHTML = '<li class="py-6 text-center text-sm text-slate-400">카테고리가 없어요.</li>'; return; }
        $('catList').innerHTML = categories.map(function (c) {
            var n = routines.filter(function (r) { return r.catId === c.id; }).length;
            var sw = COLOR_KEYS.map(function (k) {
                var on = k === c.color;
                return '<button type="button" data-cat-color="' + c.id + '|' + k + '" aria-label="' + k + '" aria-pressed="' + on + '" class="w-4 h-4 rounded-full" style="background:' + COLORS[k] + ';' + (on ? 'box-shadow:0 0 0 2px #fff,0 0 0 3.5px ' + COLORS[k] : '') + '"></button>';
            }).join('');
            return '<li class="rounded-xl border border-slate-100 p-3"><div class="flex items-center gap-2">' +
                '<input data-cat-name="' + c.id + '" value="' + esc(c.name) + '" maxlength="10" aria-label="카테고리 이름" class="field" style="padding:.4rem .7rem">' +
                '<span class="text-xs text-slate-400 whitespace-nowrap">' + n + '개</span>' +
                '<button type="button" data-cat-del="' + c.id + '" aria-label="' + esc(c.name) + ' 삭제" class="text-slate-300 hover:text-rose-500 transition"><svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>' +
                '</div><div class="mt-2.5 flex gap-2.5">' + sw + '</div></li>';
        }).join('');
    }
    function afterCatChange() { renderCatList(); render(); }

    function openCatDialog() { setMsg(''); renderCatList(); $('catDialog').showModal(); $('catNewName').focus(); }
    function addCategory(e) {
        e.preventDefault();
        var name = $('catNewName').value.trim();
        if (!name) { setMsg('이름을 입력해 주세요.'); return; }
        if (findCatByName(name, null)) { setMsg("이미 '" + name + "' 카테고리가 있어요."); return; }
        createCategory(name);
        $('catNewName').value = ''; setMsg('');
        afterCatChange();
        $('catNewName').focus();
    }
    $('catList').addEventListener('change', function (e) {
        var id = e.target.getAttribute('data-cat-name');
        if (!id) return;
        var c = catOf(Number(id)), name = e.target.value.trim();
        if (!name) { setMsg('이름은 비워둘 수 없어요.'); e.target.value = c.name; return; }
        if (findCatByName(name, c.id)) { setMsg("이미 '" + name + "' 카테고리가 있어요."); e.target.value = c.name; return; }
        c.name = name; setMsg('');
        render();
    });
    $('catList').addEventListener('click', function (e) {
        var col = e.target.closest('[data-cat-color]');
        if (col) { var p = col.getAttribute('data-cat-color').split('|'); catOf(Number(p[0])).color = p[1]; afterCatChange(); return; }
        var del = e.target.closest('[data-cat-del]');
        if (del) {
            var c = catOf(Number(del.getAttribute('data-cat-del')));
            var n = routines.filter(function (r) { return r.catId === c.id; }).length;
            if (n && !confirm("'" + c.name + "' 카테고리를 삭제할까요?\n이 카테고리의 루틴 " + n + "개는 '미분류'로 이동해요.")) return;
            routines.forEach(function (r) { if (r.catId === c.id) r.catId = null; });
            categories = categories.filter(function (x) { return x.id !== c.id; });
            setMsg(''); afterCatChange();
        }
    });
    $('catDialog').addEventListener('click', function (e) { if (e.target === this) this.close(); });
    $('routineDialog').addEventListener('click', function (e) { if (e.target === this) this.close(); });
    $('rCat').addEventListener('change', function () {
        var isNew = this.value === '__new';
        $('rCatName').classList.toggle('hidden', !isNew);
        $('rCatName').required = isNew;
        if (isNew) $('rCatName').focus();
    });

    // ───── 루틴 추가/수정/삭제 ─────
    function openRoutineDialog(id) {
        editingId = id;
        var r = null;
        routines.forEach(function (x) { if (x.id === id) r = x; });
        $('rTitle').textContent = r ? '루틴 수정' : '루틴 추가';
        $('rName').value = r ? r.name : '';
        $('rCatName').value = ''; $('rCatName').required = false;
        refreshCatSelect(r ? (r.catId === null ? '' : r.catId) : (categories.length ? categories[0].id : ''));
        $('rDelete').classList.toggle('hidden', !r);
        $('routineDialog').showModal();
        $('rName').focus();
    }
    function saveRoutine(e) {
        e.preventDefault();
        var name = $('rName').value.trim();
        if (!name) return;
        var sel = $('rCat').value, catId = null;
        if (sel === '__new') {
            var cn = $('rCatName').value.trim();
            if (!cn) { $('rCatName').focus(); return; }
            catId = (findCatByName(cn, null) || createCategory(cn)).id;
        } else if (sel !== '') { catId = Number(sel); }
        if (editingId !== null) {
            routines.forEach(function (r) { if (r.id === editingId) { r.name = name; r.catId = catId; } });
        } else {
            routines.push({ id: nextId++, name: name, catId: catId, ago: [] });
        }
        $('routineDialog').close();
        render();
    }
    function deleteRoutine() {
        if (editingId === null || !confirm('이 루틴을 삭제할까요?\n체크 기록도 함께 삭제돼요.')) return;
        var id = editingId;
        routines = routines.filter(function (r) { return r.id !== id; });
        Object.keys(checks).forEach(function (k) { if (k.indexOf(id + '|') === 0) delete checks[k]; });
        $('routineDialog').close();
        render();
    }

    // ───── 주간 체크표 ─────
    function weekStart(offset) {
        var d = addDays(today, offset * 7);
        return addDays(d, -((d.getDay() + 6) % 7));       // 월요일
    }
    function isDone(rid, k) { return !!checks[rid + '|' + k]; }
    function weekCount(r, ws) {
        var n = 0;
        for (var i = 0; i < 7; i++) if (isDone(r.id, key(addDays(ws, i)))) n++;
        return n;
    }
    routines.forEach(function (r) {            // 샘플 기록 생성
        r.ago.forEach(function (n) { checks[r.id + '|' + key(addDays(today, -n))] = true; });
    });

    // 루틴별 연속 기록: 오늘 체크 전이면 어제부터 이어서 센다
    function streakOf(r) {
        var n = 0, d = today;
        if (!isDone(r.id, key(d))) d = addDays(d, -1);
        while (n < 365 && isDone(r.id, key(d))) { n++; d = addDays(d, -1); }
        return n;
    }

    function render() {
        var ws = weekStart(weekOffset);
        var days = DAYS.map(function (_, i) { return addDays(ws, i); });
        var we = days[6];
        $('weekLabel').textContent = (ws.getMonth() + 1) + '월 ' + ws.getDate() + '일 – ' + (we.getMonth() + 1) + '월 ' + we.getDate() + '일';
        $('weekLabelKor').textContent = weekOffset === 0 ? '이번 주' : '이 주';

        $('gridHead').innerHTML = '<tr><th class="sticky-col"></th>' + days.map(function (d, i) {
            var t = key(d) === todayKey;
            return '<th class="px-1 pb-2 text-center font-medium ' + (t ? 'text-brand-700' : 'text-slate-400') + '"><div class="text-xs">' + DAYS[i] + '</div>' +
                '<div class="mx-auto mt-1 w-7 h-7 rounded-full flex items-center justify-center text-sm ' + (t ? 'bg-brand-600 text-white font-bold' : 'font-medium') + '">' + d.getDate() + '</div></th>';
        }).join('') + '<th class="pl-2 pb-2 text-xs font-medium text-slate-400 text-right w-14">주간</th></tr>';

        $('gridBody').innerHTML = routines.map(function (r) {
            var cnt = weekCount(r, ws), st = streakOf(r), c = catOf(r.catId);

            var cells = days.map(function (d) {
                var k = key(d), on = isDone(r.id, k), future = d > today, t = k === todayKey;
                return '<td class="px-1 text-center ' + (t ? 'bg-brand-50/70' : '') + '">' +
                    '<button type="button" class="cell mx-auto w-9 h-9 rounded-lg flex items-center justify-center ' +
                    (on ? 'bg-brand-600 text-white' : 'border border-slate-200 hover:border-brand-300 text-transparent') +
                    (future ? ' opacity-30 cursor-not-allowed' : '') + '" data-r="' + r.id + '" data-d="' + k + '"' + (future ? ' disabled' : '') +
                    ' aria-pressed="' + on + '" aria-label="' + esc(r.name) + ' ' + (d.getMonth() + 1) + '월 ' + d.getDate() + '일">' + CHECK + '</button></td>';
            }).join('');

            var meta = '<span class="inline-block w-1.5 h-1.5 rounded-full mr-1.5 align-middle" style="background:' + COLORS[c ? c.color : 'slate'] + '"></span>' +
                esc(c ? c.name : '미분류') +
                (st > 0 ? ' · <span class="text-brand-600 font-semibold">' + st + '일 연속</span>' : '');

            return '<tr class="border-t border-slate-100"><td class="sticky-col py-3 pr-3"><div class="min-w-[9rem]">' +
                '<button type="button" data-edit="' + r.id + '" class="block max-w-[11rem] truncate text-left font-bold text-slate-800 hover:text-brand-600 transition" title="수정">' + esc(r.name) + '</button>' +
                '<p class="mt-0.5 text-xs text-slate-400 whitespace-nowrap">' + meta + '</p></div></td>' + cells +
                '<td class="pl-2 text-right text-sm text-slate-400">' + cnt + '회</td></tr>';
        }).join('');
        $('empty').classList.toggle('hidden', routines.length > 0);

        var possible = 0, got = 0;
        days.forEach(function (d) { if (d <= today) routines.forEach(function (r) { possible++; if (isDone(r.id, key(d))) got++; }); });
        var pct = possible ? Math.round(got / possible * 100) : 0;
        $('goalMet').textContent = got;
        $('goalTotal').textContent = possible;
        $('weekPct').textContent = possible ? pct + '%' : '–';
        $('bar').style.width = pct + '%';

        var tdDone = routines.filter(function (r) { return isDone(r.id, todayKey); }).length, tdTotal = routines.length;
        var tdPct = tdTotal ? Math.round(tdDone / tdTotal * 100) : 0;
        $('tdDone').textContent = tdDone;
        $('tdTotal').textContent = tdTotal;
        $('tdPct').textContent = tdTotal ? tdPct + '%' : '–';
        $('tdBar').style.width = tdPct + '%';
    }

    function moveWeek(n) { weekOffset = n === 0 ? 0 : weekOffset + n; render(); }

    $('gridBody').addEventListener('click', function (e) {
        var cell = e.target.closest('[data-r]');
        if (cell && !cell.disabled) {
            var k = cell.getAttribute('data-r') + '|' + cell.getAttribute('data-d');
            if (checks[k]) delete checks[k]; else checks[k] = true;
            render();
            return;
        }
        var ed = e.target.closest('[data-edit]');
        if (ed) openRoutineDialog(Number(ed.getAttribute('data-edit')));
    });

    // 로그아웃 (기존 임시 대시보드 로직 유지)
    function logout() {
        fetch('/api/users/logout', {
            method: 'POST'
        }).then(function(response) {
            if (response.ok) {
                alert('로그아웃 되었습니다.');
                location.href = 'index.html';
            } else {
                alert('로그아웃 실패');
            }
        }).catch(function(error) {
            console.error('로그아웃 오류:', error);
            alert('로그아웃 중 오류가 발생했습니다.');
        });
    }

    (function init() {
        $('nick').textContent = user.nickname;
        $('today').textContent = now.toLocaleDateString('ko-KR', { month: 'long', day: 'numeric', weekday: 'long' });
        render();
    })();
</script>
</body>
</html>
