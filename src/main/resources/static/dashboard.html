<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>대시보드 (임시)</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 flex items-center justify-center min-h-screen">
<div class="bg-white p-8 rounded-2xl shadow-sm text-center space-y-4">
    <h2 class="text-2xl font-bold text-slate-800">🎉 카카오 로그인 성공!</h2>
    <p class="text-slate-500 text-sm">로그인이 정상적으로 완료되었습니다.</p>

    <!-- 버튼 영역 (첫 화면으로 가기 & 로그아웃) -->
    <div class="flex gap-2 justify-center pt-2">
        <button onclick="location.href='index.html'" class="px-4 py-2 bg-purple-600 text-white rounded-xl text-sm font-semibold hover:bg-purple-700 transition">
            첫 화면으로
        </button>
        <button onclick="logout()" class="px-4 py-2 bg-slate-200 text-slate-700 rounded-xl text-sm font-semibold hover:bg-slate-300 transition">
            로그아웃
        </button>
    </div>
</div>

<script>
    function logout() {
        fetch('/api/users/logout', {
            method: 'POST'
        }).then(function(response) {
            if (response.ok) {
                alert('로그아웃 되었습니다.');
                location.href = 'index.html';
            } else {
                alert('로그아웃 실패');
            }
        }).catch(function(error) {
            console.error('로그아웃 오류:', error);
            alert('로그아웃 중 오류가 발생했습니다.');
        });
    }
</script>
</body>
</html>
