<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>회원가입 - ROUTINE MAKER</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ["Pretendard Variable", "Pretendard", "system-ui", "sans-serif"] },
                    colors: {
                        brand: { 50: "#f7f3ff", 100: "#ede5ff", 200: "#d9c9ff", 500: "#8b5cf6", 600: "#7c3aed", 700: "#6d28d9", 900: "#2e1065" },
                        blush: { 100: "#ffe4ec", 300: "#ffb3c9", 500: "#f472a0" }
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
    <style>
        body { font-family: "Pretendard Variable", Pretendard, system-ui, sans-serif; letter-spacing: -0.01em; }
        .bg-soft {
            background:
                    radial-gradient(55rem 28rem at 90% -10%, rgba(255,179,201,.40), transparent 60%),
                    radial-gradient(50rem 30rem at -10% 90%, rgba(139,92,246,.20), transparent 60%),
                    #fbf9ff;
        }
        :focus-visible { outline: 3px solid #c4b5fd; outline-offset: 3px; }
    </style>
</head>
<body class="bg-soft text-slate-800 min-h-screen flex flex-col selection:bg-brand-100 selection:text-brand-700">

<!-- HEADER -->
<header class="w-full max-w-6xl mx-auto py-6 px-6 sm:px-10 flex justify-between items-center">
    <a href="index.html" class="flex items-center gap-2.5 text-lg font-extrabold tracking-tight text-brand-900">
        <span class="w-9 h-9 rounded-2xl bg-gradient-to-br from-brand-500 to-brand-700 flex items-center justify-center text-white shadow-lg shadow-brand-200/70">
            <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
        </span>
        Routine Maker
    </a>
    <a href="index.html" class="text-sm font-medium text-slate-500 hover:text-brand-600 transition">홈으로</a>
</header>

<!-- MAIN CONTAINER -->
<main class="flex-1 flex items-center justify-center px-4 pb-10">
    <div class="relative w-full max-w-md">
        <div class="absolute -inset-5 rounded-[3rem] bg-gradient-to-br from-brand-200/60 via-blush-100/70 to-transparent blur-2xl" aria-hidden="true"></div>

        <div class="relative bg-white/85 backdrop-blur-xl rounded-[2rem] border border-white shadow-2xl shadow-brand-200/50 p-8 sm:p-10 space-y-7">
            <div class="text-center space-y-2">
                <h2 class="text-3xl font-extrabold text-brand-900 tracking-tight">루틴 메이커 시작하기</h2>
                <p class="text-sm text-slate-500">새로운 루틴 메이커 계정을 만드세요.</p>
            </div>

            <form onsubmit="handleSignup(event)" class="space-y-4">
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label for="name" class="block text-[13px] font-semibold text-slate-700 mb-1.5">이름 (실명)</label>
                        <input type="text" id="name" required autocomplete="name" placeholder="진카리" class="w-full px-4 py-3 bg-white border border-slate-200 rounded-xl text-sm placeholder:text-slate-300 focus:outline-none focus:ring-4 focus:ring-brand-100 focus:border-brand-500 transition">
                    </div>
                    <div>
                        <label for="nickname" class="block text-[13px] font-semibold text-slate-700 mb-1.5">닉네임</label>
                        <input type="text" id="nickname" required autocomplete="nickname" placeholder="구마공주" class="w-full px-4 py-3 bg-white border border-slate-200 rounded-xl text-sm placeholder:text-slate-300 focus:outline-none focus:ring-4 focus:ring-brand-100 focus:border-brand-500 transition">
                    </div>
                </div>
                <div>
                    <label for="email" class="block text-[13px] font-semibold text-slate-700 mb-1.5">이메일</label>
                    <input type="email" id="email" required autocomplete="email" placeholder="example@email.com" class="w-full px-4 py-3 bg-white border border-slate-200 rounded-xl text-sm placeholder:text-slate-300 focus:outline-none focus:ring-4 focus:ring-brand-100 focus:border-brand-500 transition">
                </div>
                <div>
                    <label for="password" class="block text-[13px] font-semibold text-slate-700 mb-1.5">비밀번호</label>
                    <input type="password" id="password" required autocomplete="new-password" placeholder="••••••••" class="w-full px-4 py-3 bg-white border border-slate-200 rounded-xl text-sm placeholder:text-slate-300 focus:outline-none focus:ring-4 focus:ring-brand-100 focus:border-brand-500 transition">
                </div>

                <button type="submit" id="submit-btn" class="w-full bg-brand-600 hover:bg-brand-700 active:scale-[0.99] text-white font-semibold py-3.5 rounded-2xl shadow-lg shadow-brand-200/70 transition text-sm">
                    회원가입 완료
                </button>
            </form>

            <p class="text-center text-sm text-slate-500">
                이미 계정이 있으신가요?
                <a href="login.html" class="font-semibold text-brand-600 hover:text-brand-700 underline-offset-4 hover:underline">로그인</a>
            </p>
        </div>
    </div>
</main>

<!-- FOOTER -->
<footer class="w-full py-6 text-center text-xs text-slate-400">
    © 2026 ROUTINE MAKER. All rights reserved.
</footer>

<script>
    async function handleSignup(e) {
        e.preventDefault();

        const name = document.getElementById('name').value;
        const nickname = document.getElementById('nickname').value;
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;

        const requestData = {
            name: name,
            nickname: nickname,
            email: email,
            password: password
        };

        try {
            const response = await fetch('/api/users/signup', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(requestData)
            });

            if (response.ok) {
                alert('회원가입이 완료되었습니다! 로그인 페이지로 이동합니다.');
                location.href = 'login.html';
            } else {
                const errorText = await response.text();
                alert('회원가입 실패: ' + (errorText || '입력 정보를 다시 확인해주세요.'));
            }
        } catch (error) {
            console.error('Error:', error);
            alert('서버 통신 중 오류가 발생했습니다.');
        }
    }
</script>
</body>
</html>
