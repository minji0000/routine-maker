<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로그인 - ROUTINE MAKER</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ["Pretendard Variable", "Pretendard", "system-ui", "sans-serif"] },
                    colors: {
                        brand: { 50: "#f7f3ff", 100: "#ede5ff", 200: "#d9c9ff", 500: "#8b5cf6", 600: "#7c3aed", 700: "#6d28d9", 900: "#2e1065" },
                        blush: { 100: "#ffe4ec", 300: "#ffb3c9", 500: "#f472a0" }
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
    <style>
        body { font-family: "Pretendard Variable", Pretendard, system-ui, sans-serif; letter-spacing: -0.01em; }
        .bg-soft {
            background:
                    radial-gradient(55rem 28rem at 90% -10%, rgba(255,179,201,.40), transparent 60%),
                    radial-gradient(50rem 30rem at -10% 90%, rgba(139,92,246,.20), transparent 60%),
                    #fbf9ff;
        }
        :focus-visible { outline: 3px solid #c4b5fd; outline-offset: 3px; }
    </style>
</head>
<body class="bg-soft text-slate-800 min-h-screen flex flex-col selection:bg-brand-100 selection:text-brand-700">

<!-- HEADER -->
<header class="w-full max-w-6xl mx-auto py-6 px-6 sm:px-10 flex justify-between items-center">
    <a href="index.html" class="flex items-center gap-2.5 text-lg font-extrabold tracking-tight text-brand-900">
        <span class="w-9 h-9 rounded-2xl bg-gradient-to-br from-brand-500 to-brand-700 flex items-center justify-center text-white shadow-lg shadow-brand-200/70">
            <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
        </span>
        Routine Maker
    </a>
    <a href="index.html" class="text-sm font-medium text-slate-500 hover:text-brand-600 transition">홈으로</a>
</header>

<!-- MAIN CONTAINER -->
<main class="flex-1 flex items-center justify-center px-4 pb-10">
    <div class="relative w-full max-w-md">
        <div class="absolute -inset-5 rounded-[3rem] bg-gradient-to-br from-brand-200/60 via-blush-100/70 to-transparent blur-2xl" aria-hidden="true"></div>

        <div class="relative bg-white/85 backdrop-blur-xl rounded-[2rem] border border-white shadow-2xl shadow-brand-200/50 p-8 sm:p-10 space-y-7">
            <div class="text-center space-y-2">
                <h2 class="text-3xl font-extrabold text-brand-900 tracking-tight">다시 만나서 반가워요</h2>
                <p class="text-sm text-slate-500">계정에 로그인하여 루틴을 관리하세요.</p>
            </div>

            <form onsubmit="handleLogin(event)" class="space-y-4">
                <div>
                    <label for="email" class="block text-[13px] font-semibold text-slate-700 mb-1.5">이메일</label>
                    <input type="email" id="email" required autocomplete="email" placeholder="example@email.com" class="w-full px-4 py-3 bg-white border border-slate-200 rounded-xl text-sm placeholder:text-slate-300 focus:outline-none focus:ring-4 focus:ring-brand-100 focus:border-brand-500 transition">
                </div>
                <div>
                    <label for="password" class="block text-[13px] font-semibold text-slate-700 mb-1.5">비밀번호</label>
                    <input type="password" id="password" required autocomplete="current-password" placeholder="••••••••" class="w-full px-4 py-3 bg-white border border-slate-200 rounded-xl text-sm placeholder:text-slate-300 focus:outline-none focus:ring-4 focus:ring-brand-100 focus:border-brand-500 transition">
                </div>

                <button type="submit" class="w-full bg-brand-600 hover:bg-brand-700 active:scale-[0.99] text-white font-semibold py-3.5 rounded-2xl shadow-lg shadow-brand-200/70 transition text-sm">
                    로그인
                </button>
            </form>

            <div class="flex items-center gap-3 text-xs text-slate-400" aria-hidden="true">
                <span class="h-px flex-1 bg-brand-100"></span>또는<span class="h-px flex-1 bg-brand-100"></span>
            </div>

            <button type="button" onclick="requestKakaoLogin()" class="w-full bg-[#FEE500] hover:bg-[#fadb00] active:scale-[0.99] text-[#191919] font-bold py-3.5 rounded-2xl shadow-lg shadow-yellow-200/60 transition text-sm flex items-center justify-center gap-2.5">
                <svg class="w-5 h-5" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                    <path d="M12 3C6.48 3 2 6.58 2 11c0 2.84 1.87 5.32 4.67 6.74-.15.55-.55 2.01-.63 2.32-.1.38.14.37.3.25.12-.09 1.95-1.33 2.74-1.87.62.09 1.26.14 1.92.14 5.52 0 10-3.58 10-8s-4.48-8-10-8z"/>
                </svg>
                카카오로 3초 만에 시작하기
            </button>

            <p class="text-center text-sm text-slate-500">
                계정이 없으신가요?
                <a href="signup.html" class="font-semibold text-brand-600 hover:text-brand-700 underline-offset-4 hover:underline">회원가입</a>
            </p>
        </div>
    </div>
</main>

<!-- FOOTER -->
<footer class="w-full py-6 text-center text-xs text-slate-400">
    © 2026 ROUTINE MAKER. All rights reserved.
</footer>

<script>
    async function handleLogin(e) {
        e.preventDefault();

        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;

        const requestData = {
            email: email,
            password: password
        };

        try {
            const response = await fetch('/api/users/login', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(requestData)
            });

            if (response.ok) {
                const userId = await response.json();
                alert('환영합니다! 갓생 살아봅시다!');
                // 추후 메인 대시보드나 루틴 관리 페이지로 이동 (현재는 index.html로 이동)
                location.href = 'index.html';
            } else {
                const errorText = await response.text();
                alert('로그인 실패: ' + ('이메일 또는 비밀번호를 확인해주세요.'));
            }
        } catch (error) {
            console.error('Error:', error);
            alert('서버 통신 중 오류가 발생했습니다.');
        }
    }

    // 카카오 로그인 요청 함수 (포트 8081 반영)
    function requestKakaoLogin() {
        const CLIENT_ID = "5d846ff1e1edb65493f74eebd3c8b599";
        const REDIRECT_URI = "http://localhost:8081/api/users/kakao/callback";
        const kakaoAuthUrl = `https://kauth.kakao.com/oauth/authorize?client_id=${CLIENT_ID}&redirect_uri=${REDIRECT_URI}&response_type=code`;

        location.href = kakaoAuthUrl;
    }
</script>
</body>
</html>
