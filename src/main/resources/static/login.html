<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로그인 - ROUTINE MAKER</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        purple: { 50: '#f5f3ff', 100: '#ede9fe', 500: '#8b5cf6', 600: '#7c3aed', 700: '#6d28d9' }
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="/css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="bg-purple-50/40 text-slate-800 min-h-screen flex flex-col justify-between selection:bg-purple-100 selection:text-purple-700">

<!-- HEADER -->
<header class="w-full py-6 px-8 flex justify-between items-center max-w-5xl mx-auto">
    <h1 class="text-xl font-bold tracking-tight text-slate-900 cursor-pointer" onclick="location.href='index.html'">
        ROUTINE <span class="text-purple-600">MAKER</span>
    </h1>
</header>

<!-- MAIN CONTAINER -->
<main class="flex-1 flex flex-col items-center justify-center px-4 -mt-10">
    <div class="bg-white w-full max-w-md rounded-2xl shadow-xl border border-purple-50 p-8 space-y-6">
        <div class="text-center space-y-1">
            <h3 class="text-2xl font-bold text-slate-900">로그인</h3>
            <p class="text-xs text-slate-500">계정에 로그인하여 루틴을 관리하세요.</p>
        </div>

        <form onsubmit="handleLogin(event)" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold text-slate-700 mb-1">이메일</label>
                <input type="email" id="email" required placeholder="example@email.com" class="w-full px-3.5 py-2.5 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-purple-500 focus:border-purple-500">
            </div>
            <div>
                <label class="block text-xs font-semibold text-slate-700 mb-1">비밀번호</label>
                <input type="password" id="password" required placeholder="••••••••" class="w-full px-3.5 py-2.5 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-purple-500 focus:border-purple-500">
            </div>

            <button type="submit" class="w-full bg-purple-600 hover:bg-purple-700 text-white font-semibold py-3 rounded-xl shadow-sm transition text-sm">
                로그인
            </button>
        </form>

        <div class="text-center text-xs pt-2 border-t border-slate-100">
            <a href="signup.html" class="text-slate-500 hover:text-purple-600 transition">
                계정이 없으신가요? 회원가입
            </a>
        </div>
    </div>
</main>

<!-- FOOTER -->
<footer class="w-full py-6 text-center text-xs text-slate-400">
    © 2026 ROUTINE MAKER. All rights reserved.
</footer>

<script>
    async function handleLogin(e) {
        e.preventDefault();

        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;

        const requestData = {
            email: email,
            password: password
        };

        try {
            const response = await fetch('/api/users/login', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(requestData)
            });

            if (response.ok) {
                const userId = await response.json();
                alert('환영합니다! 갓생 살아봅시다!');
                // 추후 메인 대시보드나 루틴 관리 페이지로 이동 (현재는 index.html로 이동)
                location.href = 'index.html';
            } else {
                const errorText = await response.text();
                alert('로그인 실패: ' + ('이메일 또는 비밀번호를 확인해주세요.'));
            }
        } catch (error) {
            console.error('Error:', error);
            alert('서버 통신 중 오류가 발생했습니다.');
        }
    }
</script>
</body>
</html>
